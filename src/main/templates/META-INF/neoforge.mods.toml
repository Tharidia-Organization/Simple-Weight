[[mods]]
modId="tharidia_simpleweight"
version="${mod_version}"
displayName="Tharidia: Simple Weight"
logoFile="logo.png"
credits="Frenk02, The Tharidia Team"
description='''
⚠️ BETA - Under Active Development

A lightweight weight system for the Tharidia medieval fantasy roleplay server.
This mod is part of the Tharidia Project, a complex Minecraft roleplay experience set in a medieval world with fantasy elements.

Features:
- Dynamic weight calculation based on inventory items
- Movement speed penalties for heavy loads
- Swimming restrictions when overencumbered
- Counts container contents (backpacks, shulker boxes, bundles, quivers, packed tents) and Carry On loads
- Configurable weight values via datapacks
- Master/OP bypass for server administrators

Originally part of the main Tharidia Things mod, extracted for modular deployment alongside other Tharidia mods.
'''
authors="THproject Team"

[[mixins]]
config="tharidia_simpleweight.mixins.json"

[[dependencies.tharidia_simpleweight]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tharidia_simpleweight]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="BOTH"
